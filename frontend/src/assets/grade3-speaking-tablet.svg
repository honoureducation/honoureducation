<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Child with headphones holding a tablet">
  <rect width="400" height="400" fill="#ffffff"/>
  <!-- Frame -->
  <rect x="40" y="70" width="320" height="300" rx="22" fill="#ffffff" stroke="#dc2626" stroke-width="5"/>
  <!-- Grey screen behind head -->
  <rect x="120" y="30" width="160" height="150" rx="26" fill="#d1d5db" stroke="#6b7280" stroke-width="4"/>
  <!-- Sparkles -->
  <path d="M84 196 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 Z" fill="#f59e0b"/>
  <path d="M316 196 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 Z" fill="#f59e0b"/>
  <!-- Head -->
  <circle cx="200" cy="120" r="50" fill="#fdba74"/>
  <path d="M150 116 Q150 64 200 64 Q252 64 250 118 Q236 92 214 96 Q206 82 196 96 Q170 90 150 116 Z" fill="#1f2937"/>
  <!-- Headphones -->
  <path d="M146 118 Q146 54 200 54 Q254 54 254 118" stroke="#2563eb" stroke-width="10" fill="none" stroke-linecap="round"/>
  <rect x="134" y="104" width="22" height="40" rx="10" fill="#2563eb"/>
  <rect x="244" y="104" width="22" height="40" rx="10" fill="#2563eb"/>
  <!-- Face -->
  <circle cx="182" cy="124" r="5" fill="#1f2937"/>
  <circle cx="218" cy="124" r="5" fill="#1f2937"/>
  <path d="M184 144 Q200 160 216 144" stroke="#b91c1c" stroke-width="4" fill="#ef4444" stroke-linecap="round"/>
  <circle cx="170" cy="140" r="6" fill="#fca5a5" opacity="0.8"/>
  <circle cx="230" cy="140" r="6" fill="#fca5a5" opacity="0.8"/>
  <!-- Body -->
  <path d="M160 176 Q200 166 240 176 L246 290 L154 290 Z" fill="#f97316"/>
  <!-- Tablet held up -->
  <rect x="132" y="200" width="136" height="90" rx="10" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
  <path d="M132 236 H74 M268 236 H326" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <circle cx="74" cy="236" r="8" fill="#2563eb"/>
  <circle cx="326" cy="236" r="8" fill="#2563eb"/>
  <circle cx="150" cy="226" r="10" fill="#fdba74"/>
  <circle cx="250" cy="226" r="10" fill="#fdba74"/>
  <!-- Legs and shoes -->
  <rect x="166" y="290" width="26" height="50" rx="6" fill="#2563eb"/>
  <rect x="208" y="290" width="26" height="50" rx="6" fill="#2563eb"/>
  <rect x="158" y="338" width="38" height="16" rx="8" fill="#1e3a8a"/>
  <rect x="204" y="338" width="38" height="16" rx="8" fill="#1e3a8a"/>
</svg>
